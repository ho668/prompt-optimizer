name: Debug Release Sync
on: workflow_dispatch

jobs:
  debug:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASE_MIRROR_PAT }}
      SOURCE_REPO: "linshenkx/prompt-optimizer，user/repo"
      TAG: "v2.13.0"
    steps:
      - name: ① 测试Token登录
        run: |
          gh auth login --with-token <<< "$GH_TOKEN"
          echo "✅ Token登录完成"
      - name: ② 检查上游release是否存在
        run: gh release view "$TAG" -R "$SOURCE_REPO"
      - name: ③ 检查当前仓库有没有这个tag
        run: |
          if git ls-remote --tags ${{ github.repository }} | grep "$TAG"; then
            echo "✅ 当前仓库存在tag $TAG"
          else
            echo "❌ 当前仓库不存在tag $TAG"
            exit 1
          fi
